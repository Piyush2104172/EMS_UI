<div class="recent-card">

    <div class="card-header">
        <h3>Recent Employees</h3>

        <button>View All</button>
    </div>

    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let employee">{{ employee.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Employee</th>

            <td mat-cell *matCellDef="let employee">
                <div class="employee-info">
                    <div class="avatar">
                        {{ employee.name.charAt(0) }}
                    </div>

                    <span>{{ employee.name }}</span>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="department">
            <th mat-header-cell *matHeaderCellDef>Department</th>
            <td mat-cell *matCellDef="let employee">{{ employee.department }}</td>
        </ng-container>

        <ng-container matColumnDef="designation">
            <th mat-header-cell *matHeaderCellDef>Designation</th>
            <td mat-cell *matCellDef="let employee">{{ employee.designation }}</td>
        </ng-container>

        <ng-container matColumnDef="joiningDate">
            <th mat-header-cell *matHeaderCellDef>Date of join</th>
            <td mat-cell *matCellDef="let employee">{{ employee.joiningDate }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>



</div>
